[package]
name = "sql_audit"
version = "0.1.0"
edition = "2021"
description = "SQL audit core engine for the sql_audit DuckDB extension"

[lib]
name = "sql_audit"
crate-type = ["staticlib"]

[dependencies]
crossbeam-channel = "0.5"
sha2 = "0.10"
hmac = "0.12"
serde_json = "1"
libc = "0.2"
getrandom = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = [
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_Foundation",
] }

[profile.release]
opt-level = 3
lto = true
